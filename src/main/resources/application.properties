spring.application.name=payment-service
server.port=${SERVER_PORT:8085}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.datasource.url=${PAYMENT_DB_URL:jdbc:mysql://localhost:3307/payment_db}
spring.datasource.username=${PAYMENT_DB_USERNAME:payment_app}
spring.datasource.password=${PAYMENT_DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8065/eureka/}
eureka.instance.prefer-ip-address=true
management.server.port=${MANAGEMENT_SERVER_PORT:18085}
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
logitrack.security.public-key-location=${JWT_PUBLIC_KEY_LOCATION:file:./secrets/jwt-public.pem}
logitrack.security.key-id=${JWT_KEY_ID:logitrack-rsa-key}
logitrack.security.issuer=${JWT_ISSUER:https://security-service}
logitrack.security.audience=payment-service
logitrack.payments.enabled=${PAYMENTS_ENABLED:false}
logitrack.payments.sandbox=${MERCADOPAGO_SANDBOX:true}
logitrack.payments.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
logitrack.payments.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
logitrack.payments.public-url=${LOGITRACK_PUBLIC_URL:http://localhost:3000}
logitrack.payments.api-base-url=https://api.mercadopago.com
logitrack.payments.shipment-url=${SHIPMENT_SERVICE_URL:http://shipment-service}
logitrack.payments.reconciliation-delay-ms=10000
