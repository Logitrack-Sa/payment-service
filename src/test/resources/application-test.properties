spring.config.import=
spring.cloud.config.enabled=false
spring.datasource.url=jdbc:h2:mem:payments;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
eureka.client.enabled=false
logitrack.payments.enabled=true
logitrack.payments.sandbox=true
logitrack.payments.access-token=TEST-test-only-token
logitrack.payments.webhook-secret=test-only-webhook-secret
logitrack.payments.public-url=https://logitrack.example/logitrack
logitrack.payments.reconciliation-initial-delay-ms=3600000
